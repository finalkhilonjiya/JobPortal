name: Build Android (AAB + APK)

on:
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Build AAB (for Google Play)"
        type: boolean
        default: true
      build_apk:
        description: "Build APK (for direct install / testing)"
        type: boolean
        default: true

env:
  # Play requires every upload to have a HIGHER versionCode than the live one.
  # Final versionCode = BUILD_NUMBER_OFFSET + this run's number. Raise the offset
  # (Settings -> Secrets and variables -> Actions -> Variables) if Play ever says
  # "version code already used".
  BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '1000' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pre-install Android NDK (with retries)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3 4; do
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358" "$ANDROID_HOME/.temp" 2>/dev/null || true
            if yes | "$SDKM" --install "ndk;28.2.13676358"; then
              echo "NDK installed on attempt $i"; exit 0
            fi
            echo "NDK install failed (attempt $i), retrying..."; sleep 10
          done
          exit 1

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing - a Play-uploadable build needs your JKS."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build AAB
        if: ${{ inputs.build_aab }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build appbundle --release \
            --build-number=$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER)) \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Build APK
        if: ${{ inputs.build_apk }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --build-number=$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER)) \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload AAB
        if: ${{ inputs.build_aab }}
        uses: actions/upload-artifact@v4
        with:
          name: housing-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK
        if: ${{ inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: housing-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30